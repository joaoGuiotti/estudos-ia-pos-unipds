<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web AI Multimodal</title>
    <meta name="description" content="Demo de IA multimodal com Gemini Nano via Chrome built-in AI" />
    <link rel="stylesheet" href="style.scss" />
</head>
<body>

<header>
    <h1>Web AI <span class="accent">Multimodal</span></h1>
    <p class="subtitle">Powered by Gemini Nano · Chrome Built-in AI</p>
</header>

<main>

    <!-- ── Parameters panel ─────────────────────────────────────── -->
    <section class="params-panel" aria-label="Parâmetros do modelo">

        <div class="param-row">
            <label for="temperature">
                Temperature
                <span id="temp-value" class="param-badge">—</span>
            </label>
            <input id="temperature" type="range" name="temperature" />
            <div class="param-hints">
                <span>0 · determinístico</span>
                <span>máximo · criativo</span>
            </div>
        </div>

        <div class="param-row">
            <label for="topK">
                Top-K
                <span id="topk-value" class="param-badge">—</span>
            </label>
            <input id="topK" type="range" name="topK" />
            <div class="param-hints">
                <span>1 · focado</span>
                <span>máximo · diverso</span>
            </div>
        </div>

    </section>

    <!-- ── Output ────────────────────────────────────────────────── -->
    <section class="output-section" aria-label="Resposta da IA">
        <div id="output" aria-live="polite" class="markdown-body"></div>
    </section>

    <!-- ── Input form ────────────────────────────────────────────── -->
    <form id="question-form" autocomplete="off">

        <!-- File upload -->
        <div class="file-row">
            <button type="button" id="file-upload-btn" aria-label="Selecionar imagem">
                📎 Imagem
            </button>
            <span id="file-selected-name" class="file-name"></span>
            <input
                id="file-input"
                type="file"
                accept="image/*"
                aria-label="Selecionar imagem"
                hidden
            />
        </div>

        <!-- File preview -->
        <div id="file-preview" class="file-preview" aria-label="Pré-visualização do arquivo"></div>

        <!-- Text + send -->
        <div class="input-row">
            <textarea
                id="question"
                name="question"
                placeholder="Digite sua pergunta… (Enter para enviar)"
                rows="1"
                aria-label="Pergunta"
            ></textarea>
            <button type="submit" id="ask-button">Enviar</button>
        </div>

    </form>

</main>

<footer>
    <p>&copy; <span id="year"></span> Web AI Demo</p>
</footer>

<script type="module" src="src/main.ts"></script>
</body>
</html>
