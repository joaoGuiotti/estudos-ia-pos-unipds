<div class="app-layout">
  <header class="app-header">
    <nav class="app-nav" aria-label="Navegação Principal">
      <div class="brand">
        <svg lucideLandmark [size]="22" class="brand-icon" aria-hidden="true"></svg>
        <h1 class="brand-title">App de Transferência</h1>
      </div>
      <div class="nav-actions">
        <span class="product-badge">Pix Instantâneo</span>
      </div>
    </nav>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" aria-label="Menu Lateral">
      <nav>
        <menu class="sidebar-menu">
          <li class="menu-item">
            <a
              routerLink="/pix"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="menu-link"
            >
              <svg lucideArrowLeftRight [size]="18" class="menu-icon" aria-hidden="true"></svg>
              <span class="menu-text">Área Pix</span>
            </a>
          </li>
          <li class="menu-item">
            <a
              routerLink="/extrato"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="menu-link"
            >
              <svg lucideReceiptText [size]="18" class="menu-icon" aria-hidden="true"></svg>
              <span class="menu-text">Extrato Pix</span>
            </a>
          </li>
        </menu>
      </nav>
    </aside>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
